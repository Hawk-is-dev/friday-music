name: Unpack ZIP

# Upload friday-music-python.zip to the repo root, then this runs by itself.
# You can also run it by hand: Actions tab > Unpack ZIP > Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - "friday-music-python.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace repo contents with the ZIP
        run: |
          set -e
          ZIP=friday-music-python.zip
          if [ ! -f "$ZIP" ]; then echo "No $ZIP in repo root, nothing to do."; exit 0; fi

          rm -rf /tmp/new && mkdir -p /tmp/new
          unzip -q "$ZIP" -d /tmp/new

          # If everything sits inside one top folder, step into it
          SRC=/tmp/new
          if [ "$(ls -A /tmp/new | wc -l)" -eq 1 ] && [ -d "/tmp/new/$(ls -A /tmp/new)" ]; then
            SRC="/tmp/new/$(ls -A /tmp/new)"
          fi
          test -f "$SRC/requirements.txt" || { echo "requirements.txt not found in ZIP"; exit 1; }

          # Remove old files (keep .git and .github/workflows; Actions may not edit workflow files)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          if [ -d .github ]; then
            find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          fi

          cp -a "$SRC"/. ./
          # make sure workflow files stay exactly as they were
          rm -rf .github/workflows
          git checkout -- .github/workflows 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "Replace repo with Python bot"
          git push
