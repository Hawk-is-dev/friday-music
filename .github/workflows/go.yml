name: Go checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true
      - name: Download dependencies
        run: go mod tidy
      - name: Unit tests (race detector)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Docker image build
        run: docker build --tag friday-music:ci .
